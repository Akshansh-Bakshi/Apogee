[alembic]
script_location = %(here)s/migrations
# Put the backend directory on sys.path so migrations/env.py can `import app`.
prepend_sys_path = .

# The database URL is NOT set here. migrations/env.py builds it from the POSTGRES_* environment
# variables (see .env.example), so no credentials live in version control.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
